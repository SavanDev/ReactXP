name: Build
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    strategy:
      matrix:
        arch: [i386]
        config: [Debug]
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - name: Source checkout
      uses: actions/checkout@v4
      with:
        path: src
    - name: Install host tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison m4 texinfo ninja-build ccache
        pipx install "cmake>=4,<5"
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Restore toolchain
      id: toolchain
      uses: actions/cache@v4
      with:
        path: toolchain
        key: toolchain-${{ runner.os }}-${{ hashFiles('src/tools/build-toolchain.sh') }}
    - name: Build toolchain
      if: ${{ steps.toolchain.outputs.cache-hit != 'true' }}
      run: |
        bash src/tools/build-toolchain.sh ${{ github.workspace }}/toolchain ${{ runner.temp }}/toolchain-work
        rm -rf ${{ runner.temp }}/toolchain-work
    - name: Add toolchain to PATH
      run: echo "${{ github.workspace }}/toolchain/bin" >> $GITHUB_PATH
    - name: Set up ccache
      uses: actions/cache@v4
      with:
        path: ccache
        key: ccache-${{ matrix.arch }}-${{ matrix.config }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.arch }}-${{ matrix.config }}-
    - name: Configure ccache
      run: |
        echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
        echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV
        echo "CCACHE_COMPILERCHECK=string:${{ hashFiles('src/tools/build-toolchain.sh') }}" >> $GITHUB_ENV
    - name: Configure
      run: >
        cmake -S src -B build -G Ninja
        -DCMAKE_TOOLCHAIN_FILE:FILEPATH=toolchain-gcc.cmake
        -DARCH:STRING=${{ matrix.arch }}
        -DCMAKE_BUILD_TYPE=${{ matrix.config }}
        -DENABLE_CCACHE=1
    - name: Build
      run: cmake --build build
    - name: Generate ISOs
      run: cmake --build build --target bootcd livecd
    - name: Print ccache statistics
      run: ccache -s
    - name: Upload ISOs
      uses: actions/upload-artifact@v4
      with:
        name: reactxp-${{ matrix.arch }}-${{ matrix.config }}-${{ github.sha }}
        path: |
          build/bootcd.iso
          build/livecd.iso
          build/liveimg.iso
        if-no-files-found: warn
